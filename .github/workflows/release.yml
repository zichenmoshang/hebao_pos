name: Release

# 推送 v 开头的 tag 时自动构建 APK 并发布到 GitHub Releases。
# 约定：tag 名与 pubspec.yaml 的 version 保持一致，如 v1.0.0。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      # 可选：在仓库 Settings → Secrets and variables → Actions 配置以下
      # Secret 后，Release 将使用正式签名；未配置时自动回退 debug 签名。
      #   ANDROID_KEYSTORE_BASE64  base64 编码的 keystore（base64 -i release.jks）
      #   KEY_ALIAS / STORE_PASSWORD / KEY_PASSWORD
      - name: Decode release keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/release.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../release.jks
          EOF

      - name: Build split APKs
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs and generate checksums
        run: |
          VERSION=${GITHUB_REF_NAME}
          OUT="$GITHUB_WORKSPACE/release-artifacts"
          mkdir -p "$OUT"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-${abi}-release.apk" \
              "$OUT/hebao_pos_${VERSION}_${abi}.apk"
          done
          cd "$OUT"
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-artifacts/*.apk
            release-artifacts/SHA256SUMS.txt
