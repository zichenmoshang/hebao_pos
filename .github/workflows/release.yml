name: Release

# 推送 v 开头的 tag 时自动构建 APK 并发布到 GitHub Releases。
# 约定：tag 名与 pubspec.yaml 的 version 保持一致，如 v1.0.0。
# workflow_dispatch 用于手动验证 integration-test（不发版），
# 避免每次调发版门禁都要打 tag；build-and-release 仅限 tag 推送触发。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 发版拦截：先在模拟器上跑全部集成测试，失败则不构建 APK、发布中止。
  # 日常 PR 不跑（见 ci.yml），只在真实发版时启用。
  integration-test:
    runs-on: ubuntu-latest
    # 挂死兜底：软件渲染模拟器上 flutter test 可能在装完 APK 后无限静默，
    # 超时自动失败，不再依赖人工取消（正常一次约 12-18 分钟）
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      # 聚合入口一次构建跑全部用例，比逐文件执行省约 5 分钟。
      # emulator-options 显式指定软件渲染与无头参数，规避 API 34 镜像
      # 默认配置下首帧渲染卡死导致的 flutter test 静默挂起；
      # --reporter expanded 逐条输出用例进度，挂死时能看到最后线索。
      - name: Run integration tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: flutter test integration_test/all_test.dart --reporter expanded -d emulator-5554

  build-and-release:
    needs: integration-test
    # 手动 dispatch（验证集成测试）时绝不进入构建发版
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      # 可选：在仓库 Settings → Secrets and variables → Actions 配置以下
      # Secret 后，Release 将使用正式签名；未配置时自动回退 debug 签名。
      #   ANDROID_KEYSTORE_BASE64  base64 编码的 keystore（base64 -i release.jks）
      #   KEY_ALIAS / STORE_PASSWORD / KEY_PASSWORD
      # 注意：if: 条件不能引用 secrets context，因此在 shell 内判断是否为空。
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "未配置签名 Secret，本次回退 debug 签名。"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/release.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../release.jks
          EOF

      # --build-number 用 CI 自增运行号覆盖 pubspec 的 +N，保证 Android versionCode
      # 每次发布都严格递增（覆盖安装的硬性要求），不依赖 release-please 维护 build 号。
      - name: Build split APKs
        run: flutter build apk --release --split-per-abi --build-number ${{ github.run_number }}

      - name: Rename APKs and generate checksums
        run: |
          VERSION=${GITHUB_REF_NAME}
          OUT="$GITHUB_WORKSPACE/release-artifacts"
          mkdir -p "$OUT"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-${abi}-release.apk" \
              "$OUT/hebao_pos_${VERSION}_${abi}.apk"
          done
          cd "$OUT"
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Release 已由 release-please 创建（正文为 CHANGELOG 内容），这里只上传 APK，
      # 不传 body / generate_release_notes，避免覆盖 release-please 写好的更新说明。
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*.apk
            release-artifacts/SHA256SUMS.txt
